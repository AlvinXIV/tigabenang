services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tigabenang_app

    volumes:
      - ./src:/var/www
      - vendor_data:/var/www/vendor
      - ./docker/php/zz-www-dev.conf:/usr/local/etc/php-fpm.d/zz-www-dev.conf
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

    networks:
      - tigabenang_network

    depends_on:
      - postgres

  node:
    image: node:22-alpine

    container_name: tigabenang_node

    working_dir: /var/www

    volumes:
      - ./src:/var/www
      - node_modules_data:/var/www/node_modules

    ports:
      - "5173:5173"

    networks:
      - tigabenang_network

    command: tail -f /dev/null

  postgres:
    image: postgres:16-alpine

    container_name: tigabenang_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: tigabenang
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - tigabenang_network

  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: tigabenang_pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tigabenang.com
      PGADMIN_DEFAULT_PASSWORD: root

    ports:
      - "8080:80"

    depends_on:
      - postgres

    networks:
      - tigabenang_network

  nginx:
    image: nginx:alpine

    container_name: tigabenang_nginx

    ports:
      - "8000:80"

    volumes:
      - ./src:/var/www
      - vendor_data:/var/www/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - tigabenang_network

networks:
  tigabenang_network:

volumes:
  postgres_data:
  vendor_data:
  node_modules_data:
